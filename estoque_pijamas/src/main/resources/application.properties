quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3307/estoque_pijamas
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:5175
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.auth.permission.authenticated.paths=/produtos,/produtos/*
quarkus.http.auth.permission.authenticated.policy=authenticated
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}
app.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
%dev.app.session.cookie.secure=false
%test.app.session.cookie.secure=false